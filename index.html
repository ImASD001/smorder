<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Souravs Mart | Orders Dashboard</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for reading the CSV file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-6 md:p-12 text-slate-800">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900">Souravs Mart Dashboard</h1>
                <p class="text-slate-500 mt-1">Viewing order items for IDs: 3016 to 3026</p>
            </div>
            <div class="mt-4 md:mt-0 text-sm font-medium bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 flex gap-4">
                <div>Orders Displayed: <span id="order-count" class="text-blue-600 font-bold">0</span></div>
                <div class="border-l border-slate-300 pl-4">Total Value: <span id="grand-total" class="text-emerald-600 font-bold">₹0.00</span></div>
            </div>
        </header>
        
        <!-- Loading Indicator -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-slate-500 font-medium">Fetching data from order_items (1).csv...</p>
        </div>

        <!-- Dashboard Container -->
        <div id="dashboard" class="hidden space-y-8">
            <!-- Order Cards will be injected dynamically here -->
        </div>
    </div>

    <script>
        // Generating array from 3016 to 3026
        const targetOrders = Array.from({length: 11}, (_, i) => String(3016 + i));

        // Load and parse the CSV file dynamically
        Papa.parse('order_items (1).csv', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // Hide loading spinner
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                const data = results.data;
                
                // Filter the dataset for only the targeted orders
                const filteredData = data.filter(row => targetOrders.includes(String(row.order_id).trim()));

                // Group the items by order_id
                const groupedOrders = {};
                filteredData.forEach(item => {
                    const orderId = item.order_id;
                    if (!groupedOrders[orderId]) {
                        groupedOrders[orderId] = [];
                    }
                    groupedOrders[orderId].push(item);
                });

                document.getElementById('order-count').textContent = Object.keys(groupedOrders).length;
                renderDashboard(groupedOrders);
            },
            error: function(err) {
                const loader = document.getElementById('loading');
                loader.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-lg border border-red-200">
                                      <strong>Error:</strong> Could not load 'order_items (1).csv'. Ensure the file is in the same directory and you are running this on a web server (or Vercel).
                                    </div>`;
                console.error(err);
            }
        });

        // Function to render the HTML for each order
        function renderDashboard(groupedOrders) {
            const dashboard = document.getElementById('dashboard');
            let grandTotalValue = 0;
            
            // Render orders sorted numerically
            const sortedOrderIds = Object.keys(groupedOrders).sort((a, b) => parseInt(a) - parseInt(b));

            sortedOrderIds.forEach(orderId => {
                const items = groupedOrders[orderId];
                if (!items || items.length === 0) return; // Skip if order isn't in CSV

                // Calculate total for this specific order
                const orderTotal = items.reduce((sum, item) => sum + parseFloat(item.sub_total || 0), 0);
                grandTotalValue += orderTotal;

                // Build the table rows for the order items
                let rowsHtml = '';
                items.forEach((item, index) => {
                    // Alternating row colors for better readability
                    const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-slate-50';
                    rowsHtml += `
                        <tr class="border-b border-slate-100 ${rowBg} hover:bg-blue-50 transition-colors">
                            <td class="py-4 px-6 text-sm font-medium text-slate-800">${item.product_name}</td>
                            <td class="py-4 px-6 text-sm text-slate-500">${item.variant_name || '-'}</td>
                            <td class="py-4 px-6 text-sm text-slate-800 text-center font-semibold">${item.quantity}</td>
                            <td class="py-4 px-6 text-sm text-slate-600 text-right">₹${parseFloat(item.price).toFixed(2)}</td>
                            <td class="py-4 px-6 text-sm text-slate-900 text-right font-bold">₹${parseFloat(item.sub_total).toFixed(2)}</td>
                        </tr>
                    `;
                });

                // Build the final card layout for the order
                const cardHtml = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <!-- Card Header -->
                        <div class="bg-slate-800 px-6 py-5 flex justify-between items-center">
                            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                                </svg>
                                Order #${orderId}
                            </h2>
                            <span class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-full font-semibold tracking-wide">
                                ${items.length} Items
                            </span>
                        </div>
                        
                        <!-- Responsive Table -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[600px]">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200">
                                        <th class="py-3 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider">Product Name</th>
                                        <th class="py-3 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider">Variant</th>
                                        <th class="py-3 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider text-center">Qty</th>
                                        <th class="py-3 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Unit Price</th>
                                        <th class="py-3 px-6 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Card Footer (Total) -->
                        <div class="bg-slate-50 px-6 py-5 flex justify-end items-center border-t border-slate-200">
                            <div class="text-slate-500 text-sm font-medium mr-4 uppercase tracking-wider">Order Total:</div>
                            <div class="text-2xl font-black text-slate-900">₹${orderTotal.toFixed(2)}</div>
                        </div>
                    </div>
                `;

                dashboard.innerHTML += cardHtml;
            });
            
            // Update Grand Total Header
            document.getElementById('grand-total').textContent = `₹${grandTotalValue.toFixed(2)}`;
        }
    </script>
</body>
</html>
